name: Attach symbol domain

on:
  push:
    branches: [main]
    paths: [.github/workflows/attach-symbol-domain.yml]
  workflow_dispatch:

jobs:
  attach:
    name: Attach symbol domain to Cloudflare Pages
    runs-on: ubuntu-latest
    steps:
      - name: Attach symbol custom domain
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SYMBOL_DOMAIN: xn--wn8hwa.tomv.uk
        run: |
          domains="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/tigergoat/domains")"

          if jq -e --arg domain "$SYMBOL_DOMAIN" \
            '.result[]? | select(.name == $domain)' \
            <<<"$domains" >/dev/null; then
            echo "$SYMBOL_DOMAIN is already attached"
            exit 0
          fi

          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/tigergoat/domains" \
            --data "{\"name\":\"$SYMBOL_DOMAIN\"}" \
            | jq -e '.success == true' >/dev/null
