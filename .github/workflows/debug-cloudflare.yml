name: Debug Cloudflare runtime

on:
  push:
    branches: [main]

jobs:
  tail:
    name: Tail production Function and reproduce Jev request
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: browser
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: browser/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Capture runtime exception
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          deployment_url=$(npx wrangler pages deployment list \
            --project-name tigergoat \
            --environment production \
            --json | jq -r '.[0].Deployment')
          timeout 45s npx wrangler pages deployment tail "$deployment_url" \
            --project-name tigergoat \
            --format pretty > /tmp/cloudflare-tail.log 2>&1 &
          tail_pid=$!
          for _ in {1..30}; do
            grep -q 'Connected to deployment' /tmp/cloudflare-tail.log && break
            sleep 1
          done
          curl --silent --show-error "$deployment_url/api/jev" \
            -H "origin: $deployment_url" \
            -H 'content-type: application/json' \
            --data '{"state":{"playerNum":2,"numGoatsToPlace":19,"history":[[[0,4,20,24],[12]]]},"possibleMoves":[[0,1],[0,6],[4,3]]}' || true
          sleep 5
          kill "$tail_pid" || true
          wait "$tail_pid" || true
          cat /tmp/cloudflare-tail.log
