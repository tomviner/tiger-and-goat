name: Inspect Cloudflare AI billing

on:
  push:
    branches: [main]

jobs:
  inspect:
    name: Inspect credit balance and gateway limits
    runs-on: ubuntu-latest
    steps:
      - name: Read non-sensitive billing state
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          curl --silent --show-error \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/ai-gateway/billing/credit-balance" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            | jq '{success, errors, result: {balance: .result.balance, has_default_payment_method: .result.has_default_payment_method}}'
          curl --silent --show-error \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/ai-gateway/gateways" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            | jq '{success, errors, gateways: [(.result // [])[] | select(.id == "default" or .id == "tigergoat-jev") | {id, is_default, workers_ai_billing_mode, spend_limits}]}'
